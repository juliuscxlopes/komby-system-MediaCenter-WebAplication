server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # [AJUSTE] .mjs não está no mime.types padrão do nginx -- cai no
    # default_type (application/octet-stream). Workers "type: module"
    # (MapLibre) exigem Content-Type JavaScript de verdade, senão o Chrome
    # rejeita o módulo e o worker nunca termina de carregar.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}